<template>
    <lightning-card title="Bike Information">
         <div class="slds-p-around_medium">

            <!-- Success State -->
            <template lwc:if={showBikeInfo} >
                <p><strong>Name:</strong> {showBikeInfo.fields.Name.value}</p>
                <p><strong>Model:</strong> {showBikeInfo.fields.Model_Number__c.value}</p>
                <p><strong>Price:</strong> {showBikeInfo.fields.Rate__c.value}</p>
                <p><strong>Release Year:</strong> {showBikeInfo.fields.Release_Year__c.value}</p>

            </template>

            <!-- Error State -->
            <template lwc:if={hasError}>
                <p class="slds-text-color_error">
                    Error loading bike details.
                </p>
            </template>   

             </div>
                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Edit"
                        variant="brand"
                        onclick={handleEdit}
                        class="slds-m-right_small">
                    </lightning-button>

                    
                </div>

                <!--editable code-->
            <template lwc:if={isEditMode}>
                <lightning-record-edit-form
                    record-id={recordId}
                    object-api-name="bike__c"
                    onsuccess={handleSuccess}>

                    <lightning-messages></lightning-messages>

                    <lightning-input-field field-name="Name"></lightning-input-field>
                    <lightning-input-field field-name="Model_Number__c"></lightning-input-field>
                    <lightning-input-field field-name="Rate__c"></lightning-input-field>
                    <lightning-input-field field-name="Release_Year__c"></lightning-input-field>

                    <div class="slds-m-top_medium">
                        <lightning-button
                            type="submit"
                            label="Save"
                            variant="brand"
                            class="slds-m-right_small">
                        </lightning-button>

                        <lightning-button
                            label="Cancel"
                            onclick={handleCancel}>
                        </lightning-button>
                    </div>

                </lightning-record-edit-form>
               
            </template>
    </lightning-card>
</template>
